<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Gong High's Grog Guide</title>
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="Gong High's Grog Guide - Bar Cocktail Specifications" />
    <link rel="stylesheet" href="/globals.css" />
    <style>
      html, body, #root {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #0b0b0e !important;
        background: 
          radial-gradient(at 0% 0%, rgba(255, 230, 0, 0.18) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(0, 240, 255, 0.18) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(215, 75, 255, 0.15) 0px, transparent 50%),
          #0b0b0e !important;
        background-attachment: fixed !important;
        color: #ffffff;
      }

      body, input, button, select, textarea {
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: optimizeLegibility !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      }

      #root > div {
        background-color: transparent !important;
      }

      .glass-card, [data-glass-card="true"] {
        background-color: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 6px !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
      }

      .glass-input, [data-glass-search="true"] {
        background-color: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 6px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
