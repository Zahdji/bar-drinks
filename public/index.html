<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Gong High's Grog Guide</title>
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="description" content="Gong High's Grog Guide - Bar Cocktail Specifications" />
    <style>
      html, body, #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0d0d0f;
        background-image: 
          radial-gradient(at 10% 10%, rgba(255, 230, 0, 0.12) 0px, transparent 40%),
          radial-gradient(at 90% 90%, rgba(0, 240, 255, 0.12) 0px, transparent 40%),
          radial-gradient(at 50% 50%, rgba(215, 75, 255, 0.08) 0px, transparent 60%);
        background-attachment: fixed;
        color: #ffffff;
      }

      /* Force Translucent Glassmorphism on Cocktail Cards & Containers */
      [data-glass-card="true"] {
        background-color: rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 6px !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2) !important;
      }

      [data-glass-modal="true"] {
        background-color: rgba(18, 18, 22, 0.75) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 6px !important;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5) !important;
      }

      [data-glass-search="true"] {
        background-color: rgba(255, 255, 255, 0.06) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(255, 255, 255, 0.18) !important;
        border-radius: 6px !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
